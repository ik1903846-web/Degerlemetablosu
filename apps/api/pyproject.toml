[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reeldeger-api"
version = "0.1.0"
description = "REELDEĞER Damodaran-aligned BIST valuation API"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "REELDEĞER Team" }
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
    # Faz 1.2: Damodaran fetcher
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "asyncpg>=0.30.0",
    "python-dotenv>=1.0.0",
    "xlrd>=2.0.0",  # .xls (eski Excel format) reader — Damodaran sector betas için
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

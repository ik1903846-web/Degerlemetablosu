name: Damodaran Daily Hash Check

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Verbose log'
        required: false
        default: 'false'
      force_regen:
        description: 'Force JSON regen (skip decision logic)'
        required: false
        default: 'false'
      reset_state:
        description: 'Reset state (clear cache, fresh first_check)'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check:
    name: HEAD check Damodaran URLs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx openpyxl

      - name: Restore state cache
        id: state_cache
        if: github.event.inputs.reset_state != 'true'
        uses: actions/cache@v4
        with:
          path: |
            apps/api/data/damodaran/_hash_state.json
            apps/api/data/damodaran/_regen_state.json
            apps/api/data/damodaran/_fetch_log.jsonl
          key: damodaran-state-${{ github.run_id }}
          restore-keys: |
            damodaran-state-

      - name: Show state restore status
        run: |
          {
            echo "## State Restore"
            echo ""
            if [ "${{ github.event.inputs.reset_state }}" = "true" ]; then
              echo "- :recycle: **Reset state requested** (cache skip)"
            elif [ "${{ steps.state_cache.outputs.cache-hit }}" = "true" ]; then
              echo "- :white_check_mark: **Exact cache hit** (same run_id, unusual)"
            else
              echo "- :information_source: **Cache restore via fallback key**"
            fi
            echo ""
            echo "### Restored files"
            for f in _hash_state.json _regen_state.json; do
              path="apps/api/data/damodaran/$f"
              if [ -f "$path" ]; then
                size=$(stat -c '%s' "$path" 2>/dev/null || stat -f '%z' "$path")
                echo "- $f: ${size} bytes"
              else
                echo "- $f: (yok, ilk run)"
              fi
            done
          } >> $GITHUB_STEP_SUMMARY

      - name: Run hash state check
        id: hash_check
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python apps/api/data_layer/damodaran_hash_state.py 2>&1 | tee check_output.txt

          CHANGED=$(grep -E "Changed:\s+[0-9]+" check_output.txt | tail -1 | grep -oE "[0-9]+" | head -1)
          ERROR=$(grep -E "Error:\s+[0-9]+" check_output.txt | tail -1 | grep -oE "[0-9]+" | head -1)

          echo "changed=${CHANGED:-0}" >> $GITHUB_OUTPUT
          echo "error=${ERROR:-0}" >> $GITHUB_OUTPUT

          {
            echo ""
            echo "## Damodaran Hash Check Summary"
            echo ""
            echo "- **Changed URLs:** ${CHANGED:-0}"
            echo "- **Errors:** ${ERROR:-0}"
            echo ""
            echo "### Detail"
            echo '```'
            cat check_output.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Vintage cross-check (if changed)
        id: vintage
        if: steps.hash_check.outputs.changed != '0'
        run: |
          python apps/api/data_layer/damodaran_vintage_parser.py \
            --json --output vintage_summary.json 2>&1 | tee vintage_output.txt

          # ctryprem vintage'ini extract (primary kaynak)
          CTRYPREM_VINTAGE=$(python -c "
          import json
          data = json.load(open('vintage_summary.json'))
          print(data.get('ctryprem', {}).get('vintage', 'unknown'))
          ")
          echo "ctryprem_vintage=${CTRYPREM_VINTAGE}" >> $GITHUB_OUTPUT

          {
            echo ""
            echo "## Vintage Parser Output"
            echo "- **ctryprem vintage:** \`${CTRYPREM_VINTAGE}\`"
            echo ""
            echo "### Detail"
            echo '```'
            cat vintage_output.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Run regen decision logic
        id: regen_decide
        run: |
          python apps/api/data_layer/damodaran_regen_trigger.py \
            --decide --output regen_decision.json 2>&1 | tee regen_output.txt

          REASON=$(python -c "import json; print(json.load(open('regen_decision.json'))['reason'])")
          ACTION=$(python -c "import json; print(json.load(open('regen_decision.json'))['action'])")

          echo "reason=${REASON}" >> $GITHUB_OUTPUT
          echo "action=${ACTION}" >> $GITHUB_OUTPUT

          {
            echo ""
            echo "## Regen Decision"
            echo ""
            echo "- **Reason:** ${REASON}"
            echo "- **Action:** ${ACTION}"
            echo ""
            echo "### Detail"
            echo '```json'
            cat regen_decision.json
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Open issue if manual update needed (idempotent)
        if: steps.regen_decide.outputs.action == 'alert_manual_update' || steps.regen_decide.outputs.action == 'regen_and_alert'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const decision = JSON.parse(fs.readFileSync('regen_decision.json', 'utf8'));
            const vintage = '${{ steps.vintage.outputs.ctryprem_vintage }}' || 'unknown';
            const vintageLabel = `vintage:${vintage}`;
            const date = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Idempotency check: aynı vintage label'i ile open issue var mi?
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['damodaran-update', vintageLabel],
            });

            if (existingIssues.length > 0) {
              // Mevcut issue'ya comment ekle
              const issueNumber = existingIssues[0].number;
              const commentBody = [
                `### Re-detection (${date})`,
                '',
                `Workflow run: ${runUrl}`,
                '',
                `Bu update vintage'i (\`${vintage}\`) icin issue hala acik.`,
                `Audit checklist henuz tamamlanmamis.`,
                '',
                `**Reason:** \`${decision.reason}\``,
                `**Action:** \`${decision.action}\``,
                '',
                `_Auto-comment by ADR-040 v2 idempotent check (Session 5.5c)._`
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: commentBody,
              });

              core.notice(`Existing issue #${issueNumber} updated (vintage ${vintage})`);
              core.setOutput('issue_action', 'commented');
              core.setOutput('issue_number', String(issueNumber));
            } else {
              // Yeni issue ac
              const title = `Damodaran update detected (${vintage}) - manual cost_of_capital review needed`;
              const body = [
                '## Otomatik Tespit',
                '',
                `Workflow run: ${runUrl}`,
                '',
                `**Vintage:** \`${vintage}\``,
                `**Reason:** \`${decision.reason}\``,
                `**Action:** \`${decision.action}\``,
                `**Timestamp:** ${decision.timestamp_utc}`,
                `**Hash changed URLs:** ${decision.hash_changed_urls.join(', ') || '(yok)'}`,
                '',
                '## Yapilmasi Gereken (Audit Disiplin)',
                '',
                '1. Damodaran resmi sayfasini kontrol et:',
                '   https://pages.stern.nyu.edu/~adamodar/New_Home_Page/datafile/ctryprem.html',
                '',
                '2. parameters.json fetch (Faz B1 Adim 1):',
                '   `python apps/api/scripts/fetch_damodaran_v2_audit.py`',
                '',
                '3. xlsx verify (Faz B1 Adim 2B):',
                '   `python apps/api/scripts/verify_damodaran_xlsx.py`',
                '',
                '4. Production diff (Faz B1 Adim 2C):',
                '   `python apps/api/scripts/diff_production_vs_damodaran.py`',
                '',
                '5. cost_of_capital.py constants update (Faz B1 Adim 7)',
                '',
                '6. Sonra workflow_dispatch ile bu workflow tekrar calistir,',
                '   action=regen_json olur, JSON otomatik regen notice gelir.',
                '',
                '## Audit Chain Reference',
                '',
                '- `docs/audit_findings_session4.md`',
                '- `docs/audit_decision_v4.md`',
                '- `docs/audit_resolution_session4.md`',
                '- `docs/adr_040_postmortem.md`',
                '',
                '_Auto-created by ADR-040 v2 daily check (Session 5.5c idempotent)._'
              ].join('\n');

              const { data: newIssue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['damodaran-update', 'audit-required', vintageLabel],
              });

              core.notice(`New issue #${newIssue.number} opened (vintage ${vintage})`);
              core.setOutput('issue_action', 'created');
              core.setOutput('issue_number', String(newIssue.number));
            }

      - name: Run JSON regen
        if: steps.regen_decide.outputs.action == 'regen_json' || steps.regen_decide.outputs.action == 'regen_and_alert' || github.event.inputs.force_regen == 'true'
        id: regen_run
        run: |
          echo "::warning::CI runner'da parsed_financials cache YOK (251 ticker)."
          echo "::warning::Gercek JSON regen local'de yapilmalidir."

          {
            echo ""
            echo "## JSON Regen Notice"
            echo ""
            echo ":warning: CI runner cache miss riski nedeniyle JSON regen LOCAL yapilmalidir."
            echo ""
            echo "**Komut:**"
            echo '```bash'
            echo "python -c \""
            echo "import json, sys; sys.path.insert(0, '.')"
            echo "from apps.api.orchestrator_v4 import run_pipeline_v4, save_v4_batch_json"
            echo "with open('apps/api/outputs/turkey_v4_batch.json', encoding='utf-8') as f:"
            echo "    b = json.load(f)"
            echo "universe = [t['ticker'] for t in b['tickers']]"
            echo "results = run_pipeline_v4(universe=universe, progress=True, fetch_yfinance_live=False)"
            echo "save_v4_batch_json(results)"
            echo "\""
            echo '```'
            echo ""
            echo "Sonra: \`git add ... && git commit ... && git push\`"
          } >> $GITHUB_STEP_SUMMARY

      - name: Append audit log
        if: always()
        env:
          ISSUE_CREATED: ${{ steps.regen_decide.outputs.action == 'alert_manual_update' || steps.regen_decide.outputs.action == 'regen_and_alert' }}
        run: |
          ARGS=(
            --run-id "${{ github.run_id }}"
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            --conclusion "${{ job.status }}"
            --trigger "${{ github.event_name }}"
            --hash-output check_output.txt
            --decision regen_decision.json
          )
          if [ "$ISSUE_CREATED" = "true" ]; then
            ARGS+=(--issue-created)
          fi

          python apps/api/data_layer/damodaran_audit_log.py record "${ARGS[@]}"

          # Son 5 record summary
          {
            echo ""
            echo "## Audit Log Recent"
            echo '```'
            python apps/api/data_layer/damodaran_audit_log.py recent --limit 5
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Persist state cache (after run)
        if: always() && github.event.inputs.reset_state != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            apps/api/data/damodaran/_hash_state.json
            apps/api/data/damodaran/_regen_state.json
            apps/api/data/damodaran/_fetch_log.jsonl
          key: damodaran-state-${{ github.run_id }}

      - name: Fail on error
        if: steps.hash_check.outputs.error != '0'
        run: |
          echo "::error::HEAD check encountered errors"
          exit 1

name: Batch Regen Daily (turkey_v4_batch.json)

on:
  schedule:
    - cron: '0 16 * * 1-5'
  workflow_dispatch:
    inputs:
      skip_sanity:
        description: 'Skip sanity gates (debug only)'
        required: false
        default: 'false'
      skip_commit:
        description: 'Skip auto-commit (dry-run)'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write

jobs:
  regen:
    name: Full universe batch regen
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore runtime cache
        id: cache_restore
        uses: actions/cache@v4
        with:
          path: |
            apps/api/_cache/yfinance
            apps/api/_cache/kap_excel
            apps/api/_cache/kap_float
            apps/api/_cache/kap_subsidiaries
            apps/api/_cache/market_caps
            apps/api/_cache/parsed_financials
            apps/api/_cache/ticker_mappings.json
            apps/api/_cache/ticker_sectors.json
            apps/api/_cache/fundamentals.json
          key: runtime-cache-${{ github.run_id }}
          restore-keys: |
            runtime-cache-

      - name: Show cache restore status
        run: |
          {
            echo "## Cache Restore"
            echo ""
            if [ "${{ steps.cache_restore.outputs.cache-hit }}" = "true" ]; then
              echo "- :white_check_mark: Exact cache hit (same run_id, unusual)"
            else
              echo "- :information_source: Cache restore via fallback key (or first run)"
            fi
            echo ""
            for d in yfinance kap_excel kap_float kap_subsidiaries market_caps parsed_financials; do
              path="apps/api/_cache/$d"
              if [ -d "$path" ]; then
                count=$(find "$path" -type f 2>/dev/null | wc -l)
                echo "- $d: ${count} files"
              else
                echo "- $d: (yok, ilk run)"
              fi
            done
          } >> $GITHUB_STEP_SUMMARY

      - name: Backup mevcut batch
        run: |
          if [ -f "apps/api/outputs/turkey_v4_batch.json" ]; then
            cp apps/api/outputs/turkey_v4_batch.json \
               apps/api/outputs/turkey_v4_batch_pre_regen.json
            echo "Backup yazildi: turkey_v4_batch_pre_regen.json"
          else
            echo "Mevcut batch yok (ilk run)"
          fi

      - name: Run batch regen
        id: regen_run
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -eo pipefail
          python -u apps/api/_regen_phase1.py 2>&1 | tee regen_output.txt

          # Stats extract
          DCF_COUNT=$(grep -E "DCF intrinsic dolu:\s+[0-9]+" regen_output.txt | grep -oE "[0-9]+" | head -1)
          CH_COUNT=$(grep -E "CH-added populate.*[0-9]+" regen_output.txt | grep -oE "[0-9]+" | head -1)
          DURATION=$(grep -E "Regen tamamlandi:\s+[0-9.]+\s+sn" regen_output.txt | grep -oE "[0-9.]+" | head -1)

          echo "dcf_count=${DCF_COUNT:-0}" >> $GITHUB_OUTPUT
          echo "ch_count=${CH_COUNT:-0}" >> $GITHUB_OUTPUT
          echo "duration_sec=${DURATION:-0}" >> $GITHUB_OUTPUT

      - name: Sanity gates
        id: sanity
        if: github.event.inputs.skip_sanity != 'true'
        run: |
          set -eo pipefail
          python -u <<'PY' 2>&1 | tee sanity_output.txt
          import json, sys
          from pathlib import Path

          new_path = Path("apps/api/outputs/turkey_v4_batch.json")
          old_path = Path("apps/api/outputs/turkey_v4_batch_pre_regen.json")

          if not new_path.exists():
              print("FAIL: new batch yok")
              sys.exit(2)

          new = json.loads(new_path.read_text(encoding="utf-8"))
          new_map = {t["ticker"]: t for t in new.get("tickers", [])}

          # GATE A: TUPRS = 211.95 +/- 0.01%
          ANCHOR_TUPRS = 211.95
          TOLERANCE_PCT = 0.01
          tuprs = new_map.get("TUPRS", {})
          tuprs_val = tuprs.get("intrinsic_per_share_tl")
          if tuprs_val is None:
              print(f"FAIL Gate A: TUPRS intrinsic None")
              sys.exit(2)
          drift_pct = abs(tuprs_val - ANCHOR_TUPRS) / ANCHOR_TUPRS * 100
          if drift_pct > TOLERANCE_PCT:
              print(f"FAIL Gate A: TUPRS={tuprs_val:.4f} drift {drift_pct:.4f}% > {TOLERANCE_PCT}%")
              sys.exit(2)
          print(f"PASS Gate A: TUPRS={tuprs_val:.4f} drift {drift_pct:.4f}% <= {TOLERANCE_PCT}%")

          # GATE B: Anomali sayisi (delta > 1%) < 50
          if old_path.exists():
              old = json.loads(old_path.read_text(encoding="utf-8"))
              old_map = {t["ticker"]: t for t in old.get("tickers", [])}
              anomaly = 0
              for ticker, n in new_map.items():
                  o = old_map.get(ticker, {})
                  ov = o.get("intrinsic_per_share_tl")
                  nv = n.get("intrinsic_per_share_tl")
                  if ov and nv and ov > 0:
                      delta = abs((nv - ov) / ov * 100)
                      if delta > 1.0:
                          anomaly += 1
              if anomaly >= 50:
                  print(f"FAIL Gate B: anomaly count {anomaly} >= 50")
                  sys.exit(2)
              print(f"PASS Gate B: anomaly count {anomaly} < 50")
          else:
              print("SKIP Gate B: prev batch yok (ilk run)")

          # GATE C: NaN intrinsic patlama yok (+10%)
          if old_path.exists():
              new_nan = sum(1 for t in new["tickers"] if t.get("intrinsic_per_share_tl") is None)
              old_nan = sum(1 for t in old["tickers"] if t.get("intrinsic_per_share_tl") is None)
              if old_nan > 0:
                  growth = (new_nan - old_nan) / old_nan * 100
                  if growth > 10.0:
                      print(f"FAIL Gate C: NaN {old_nan} -> {new_nan} (+{growth:.1f}%) > 10%")
                      sys.exit(2)
                  print(f"PASS Gate C: NaN {old_nan} -> {new_nan} ({growth:+.1f}%)")
              else:
                  print(f"SKIP Gate C: prev NaN=0")
          else:
              print("SKIP Gate C: prev batch yok")

          print()
          print("ALL SANITY GATES PASS")
          PY

      - name: Diff summary
        if: always()
        run: |
          python -u <<'PY' 2>&1 >> $GITHUB_STEP_SUMMARY
          import json
          from pathlib import Path

          new_path = Path("apps/api/outputs/turkey_v4_batch.json")
          old_path = Path("apps/api/outputs/turkey_v4_batch_pre_regen.json")

          print("")
          print("## Batch Regen Summary")
          print("")
          if not new_path.exists():
              print("- :x: new batch yok")
              raise SystemExit(0)
          new = json.loads(new_path.read_text(encoding="utf-8"))
          print(f"- Ticker count: {len(new.get('tickers', []))}")
          dcf = sum(1 for t in new['tickers'] if t.get('intrinsic_per_share_tl'))
          ch = sum(1 for t in new['tickers'] if t.get('cross_holdings_added_tl'))
          print(f"- DCF intrinsic dolu: {dcf}")
          print(f"- CH-added populate: {ch}")
          print(f"- TUPRS anchor: {new.get('anchor_tuprs')}")

          if not old_path.exists():
              print("- (prev batch yok, diff atlandi)")
              raise SystemExit(0)
          old = json.loads(old_path.read_text(encoding="utf-8"))
          old_map = {t["ticker"]: t for t in old.get("tickers", [])}
          new_map = {t["ticker"]: t for t in new.get("tickers", [])}

          diffs = []
          for tk, n in new_map.items():
              o = old_map.get(tk, {})
              ov = o.get("intrinsic_per_share_tl")
              nv = n.get("intrinsic_per_share_tl")
              if ov and nv and ov > 0:
                  d = (nv - ov) / ov * 100
                  diffs.append((tk, ov, nv, d))
          diffs.sort(key=lambda x: -abs(x[3]))
          print("")
          print("### TOP 10 Delta")
          print("")
          print("| Ticker | Old | New | Delta % |")
          print("|--------|-----|-----|---------|")
          for tk, ov, nv, d in diffs[:10]:
              print(f"| {tk} | {ov:.2f} | {nv:.2f} | {d:+.2f}% |")
          PY

      - name: Persist runtime cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            apps/api/_cache/yfinance
            apps/api/_cache/kap_excel
            apps/api/_cache/kap_float
            apps/api/_cache/kap_subsidiaries
            apps/api/_cache/market_caps
            apps/api/_cache/parsed_financials
            apps/api/_cache/ticker_mappings.json
            apps/api/_cache/ticker_sectors.json
            apps/api/_cache/fundamentals.json
          key: runtime-cache-${{ github.run_id }}

      - name: Auto-commit batch.json
        if: success() && github.event.inputs.skip_commit != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Sadece batch.json değişikliği commit'lenecek
          rm -f apps/api/outputs/turkey_v4_batch_pre_regen.json

          if git diff --quiet apps/api/outputs/turkey_v4_batch.json; then
            echo "No change in turkey_v4_batch.json, skipping commit"
          else
            git add apps/api/outputs/turkey_v4_batch.json
            git commit -m "chore: batch regen auto-commit (cron $(date -u +%Y-%m-%d))" \
                       -m "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            git push origin HEAD:main
          fi

      - name: Open issue on sanity fail
        if: failure() && steps.sanity.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let sanityOutput = '';
            try { sanityOutput = fs.readFileSync('sanity_output.txt', 'utf8'); } catch(e) {}
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const date = new Date().toISOString().split('T')[0];

            const title = `Batch regen sanity gate FAIL (${date})`;
            const body = [
              '## Sanity Gate Failure',
              '',
              `Workflow run: ${runUrl}`,
              '',
              '**Sanity output:**',
              '```',
              sanityOutput || '(output not captured)',
              '```',
              '',
              '## Next Steps',
              '',
              '1. Local olarak `python apps/api/_regen_phase1.py` calistir',
              '2. Sanity bug mu, gercek production drift mi inceleme',
              '3. Anchor v4.3 (TUPRS=211.95) compromise olduysa audit chain',
              '4. Auto-commit YAPILMADI, batch.json onceki state\'te'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['batch-regen', 'sanity-fail', 'auto-detected'],
            });

            core.notice(`Sanity fail issue opened`);
